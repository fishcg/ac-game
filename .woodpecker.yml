clone:
  git:
    image: 172.24.173.77:30500/woodpecker-git:latest
    settings:
      partial: false
      depth: 1
      tags: true

steps:
  build-and-push:
    image: 172.24.173.77:30500/standard-docker:latest
    privileged: true
    settings:
      registry: http://172.24.173.77:30500
      repo: 172.24.173.77:30500/ac-game
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:7}
      insecure: true
    when:
      event: [push, tag]

  update-k8s-deployment:
    image: 172.24.173.77:30500/bitnami-kubectl:latest
    environment:
      KUBECONFIG: /woodpecker/kubeconfig
    commands:
      - kubectl set image deployment/ac-game ac-game=172.24.173.77:30500/ac-game:${CI_COMMIT_SHA:0:7} --namespace=default
    when:
      event: [push, tag]
