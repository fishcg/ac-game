apiVersion: v1
kind: Service
metadata:
  name: ac-game-service
  labels:
    app: ac-game
spec:
  type: NodePort
  selector:
    app: ac-game
  ports:
    - name: web
      port: 4399
      targetPort: web
      nodePort: 30399
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac-game
  labels:
    app: ac-game
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ac-game
  template:
    metadata:
      labels:
        app: ac-game
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ac-game
          image: ghcr.io/fishcg/ac-game:latest
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 4399
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4399"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: next-cache
              mountPath: /home/www/ac-game/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
